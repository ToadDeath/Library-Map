<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colorado Library Districts Map</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

  <style>
    /* Reset */
    html, body {
      height: 100%;
      margin: 0;
    }

    /* Map fills the screen */
    #map {
      height: 100%;
      width: 100%;
    }

    /* Sidebar */
    #sidebar {
      position: absolute;
      top: 0;
      right: 0;
      width: 300px;
      height: 100%;
      background: #fff;
      overflow-y: auto;
      padding: 10px;
      border-left: 1px solid #ccc;
      display: none; /* Hidden until a district is clicked */
      z-index: 1000;
    }
  </style>
</head>
<body>
  <!-- MAP CONTAINER -->
  <div id="map"></div>

  <!-- SIDEBAR -->
  <div id="sidebar">
    <h2 id="sidebar-title">Select a district</h2>
    <div id="sidebar-content"></div>
  </div>

  <!-- Turf.js -->
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <!-- Leaflet AJAX -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-ajax/2.1.0/leaflet.ajax.min.js"></script>

  <script>
    // Initialize map
    const map = L.map('map').setView([39, -105.5], 7); // Colorado-ish

    // Add basemap
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // Load GeoJSON (replace with your own .geojson path)
    const districts = new L.GeoJSON.AJAX("districts.geojson", {
      onEachFeature: function (feature, layer) {
        layer.on("click", function () {
          // Show sidebar
          document.getElementById("sidebar").style.display = "block";

          // Update content
          document.getElementById("sidebar-title").textContent = feature.properties.NAME || "District";
          document.getElementById("sidebar-content").innerHTML = `
            <p><strong>ID:</strong> ${feature.properties.ID || "N/A"}</p>
            <p><strong>Other Info:</strong> ${feature.properties.INFO || "N/A"}</p>
          `;
        });
      },
      style: {
        color: "blue",
        weight: 2,
        fillOpacity: 0.2
      }
    }).addTo(map);
  </script>
</body>
</html>
